name: Build Darwin SDK

on:
  workflow_dispatch:

jobs:
  build-sdk:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $xcode"
          sudo xcode-select -s "$xcode"
          echo "XCODE_APP=$xcode" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool

      - name: Build Darwin SDK
        run: |
          mkdir -p out
          xtool sdk build "$XCODE_APP" --arch x86_64 out/
          ls -la out/

      - name: Archive SDK
        run: |
          cd out
          tar -czvf ../darwin-sdk.tar.gz .

      - name: Upload SDK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-sdk
          path: darwin-sdk.tar.gz
